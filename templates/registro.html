<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Torneo ALL STARS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Capa del vídeo de fondo */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Lo manda al fondo */
            overflow: hidden;
        }
        video {
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            filter: brightness(0.4); /* Oscurece el vídeo de LoL para que se vea el texto */
        }

        /* Estilo lila/violeta para la tarjeta */
        .card-custom {
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(10px); /* Efecto cristal borroso */
            border: 1px solid #bc13fe;
            border-radius: 15px;
            color: white;
        }
        .btn-violet {
        /* Degradado de Azul Cian a Lila */
        background: linear-gradient(90deg, #00f2ff 0%, #bc13fe 100%) !important;
        color: white;
        font-weight: bold;
        border: none;
        transition: 0.3s;
        padding: 10px 20px; /* Para que se vea más grande y pro */
        border-radius: 8px;
    }

        .btn-violet:hover {
        /* Efecto de brillo al pasar el ratón */
        box-shadow: 0 0 20px rgba(0, 242, 255, 0.6);
        transform: scale(1.02);
    }
        .card-custom {
        background: rgba(26, 26, 26, 0.9) !important; /* Fondo oscuro sólido */
        backdrop-filter: blur(10px);
        border-radius: 15px !important;

        /* 1. Creamos el borde con degradado */
        border: 2px solid transparent !important;
        background-image: linear-gradient(rgba(26, 26, 26, 0.9), rgba(26, 26, 26, 0.9)),
                      linear-gradient(90deg, #00f2ff, #bc13fe);
        background-origin: border-box;
        background-clip: padding-box, border-box;

        /* 2. Añadimos el brillo neón (Glow) */
        box-shadow: 0 0 20px rgba(0, 242, 255, 0.2),
                0 0 40px rgba(188, 19, 254, 0.1) !important;
}

/* Para que los títulos también acompañen el degradado */
        .card-custom h3 {
        background: linear-gradient(90deg, #00f2ff, #bc13fe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: bold;
}
        .text-violet { color: #bc13fe; }
    </style>
</head>
<body>

    <div class="video-bg">
        <video autoplay muted loop playsinline>
            <source src="{{ url_for('static', filename='fondo_inicio.mp4') }}" type="video/mp4">
        </video>
    </div>

    <div class="container vh-100 d-flex align-items-center">
    <div class="row w-100 align-items-center">

        <div class="col-md-6 text-white px-5">
            <h1 class="display-1 fw-bold">TORNEOS <br><span class="text-violet">ALL STARS</span></h1>
            <p class="lead">Domina la grieta en <b>League of Legends</b>,
            demuestra tu puntería en <b>Valorant</b>,
            y sé el último en pie en <b>Apex Legends.</b>
            Inscríbete ahora y participa. Compite al más alto nivel en nuestros torneos.</p>
        </div>

        <div class="col-md-5 offset-md-1">
            <div class="card card-custom p-4 shadow-lg">
                <h3 class="text-center mb-4 text-white">Crea tu cuenta</h3>

                    <form action="/registro" method="POST">
                        <div class="mb-3">
                            <label class="form-label small">Usuario</label>
                            <input type="text" name="nombre" class="form-control bg-dark text-white border-secondary" placeholder="Tu nombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">Email</label>
                            <input type="email" name="email" class="form-control bg-dark text-white border-secondary" placeholder="ejemplo@correo.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small">Contraseña</label>
                            <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
                        </div>
                        <button type="submit" class="btn btn-violet w-100 py-2">REGíSTRATE</button>
                    </form>
                    <p class="text-center mt-4 mb-0">
                        ¿Ya tienes cuenta? <a href="/login" class="text-violet text-decoration-none">Inicia sesión</a>
                    </p>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
